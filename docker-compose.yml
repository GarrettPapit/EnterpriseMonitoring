
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterprise_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - monitor-net

  api:
    build:
      context: ./src/Backend
      dockerfile: Dockerfile
    container_name: enterprise_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ActivityMonitorDb;User Id=sa;Password=YourStrong@Password2026!;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    networks:
      - monitor-net

volumes:
  sqldata:

networks:
  monitor-net:
    driver: bridge